name: life_and_roads
description: Caderneta digital de uma motocicleta. Ficha, manutenção, viagem e GPS.
publish_to: 'none'
version: 1.4.1+9

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  http: ^1.5.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_map: ^8.2.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  google_fonts: ^6.3.2
  image_picker: ^1.2.0
  flutter_riverpod: ^2.6.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
  path: ^1.9.1
  sqlite3: ^3.5.2
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    # lr.png fica só para o flutter_launcher_icons (lido no build); a logo
    # em tela é vetor (core/marca).
    - assets/catalogo/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/lr.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/lr.png
  # O ícone da tela inicial do iPhone e do Android sai daqui. Sem isto, quem
  # instalar o app web recebe o logo padrão do Flutter.
  web:
    generate: true
    image_path: assets/lr.png
    background_color: "#121212"
    theme_color: "#121212"
