openapi: 3.0.3
info:
  title: life.and.roads API
  version: 1.2.0
  description: >
    Cofre opcional da caderneta. Uma moto por conta.
    Sem placa, chassi, RENAVAM ou foto. Abastecimentos, serviços, pinos,
    PSI e o resto que só existia no aparelho vão em /caderneta, cifrados
    no servidor (ADR 0038).
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      summary: Liveness (processo no ar)
      responses:
        '200':
          description: ok
  /ready:
    get:
      summary: Readiness (MySQL responde)
      responses:
        '200':
          description: banco ok
        '503':
          description: banco indisponível
  /monitor/evento:
    post:
      summary: Crash do app ou recusa do convite de conta (curto, sem PII)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tipo, mensagem]
              properties:
                tipo:
                  type: string
                  enum: [flutter_error, flutter_zone, conta_recusada]
                mensagem:
                  type: string
                  maxLength: 500
                ambiente:
                  type: string
                  enum: [development, staging, production]
                versaoApp:
                  type: string
                  maxLength: 40
                  nullable: true
                  description: versionName+build, vindo de --dart-define=APP_VERSION
                plataforma:
                  type: string
                  maxLength: 80
                  nullable: true
                  description: ex. "android 14" ou "web"
                pilha:
                  type: string
                  maxLength: 2000
                  nullable: true
                  description: começo da stack trace, sem dado do piloto
      responses:
        '200':
          description: registrado no log e na tabela eventos_cliente (90 dias)
  /auth/registrar:
    post:
      summary: Cria a conta
      description: >-
        Depois de criar, manda uma boas-vindas ao e-mail da conta, sem esperar
        o envio. Se o envio falhar, a conta existe do mesmo jeito e a resposta
        não muda (ADR 0036). Com termosVersao, grava a versão aceita e a hora
        do aceite; sem o campo, como o APK antigo, grava nulo (ADR 0038).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cadastro'
      responses:
        '201':
          description: conta criada
        '400':
          description: e-mail inválido, senha curta ou versão dos termos fora do formato
        '409':
          description: e-mail já cadastrado
  /auth/login:
    post:
      summary: Access curto + refresh revogável
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciais'
      responses:
        '200':
          description: token (access) e refreshToken
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: integer }
                  email: { type: string }
                  id: { type: integer }
                  termosVersao:
                    type: string
                    nullable: true
                    description: >-
                      Versão dos termos que a conta aceitou, ou null. O app
                      compara com a atual antes de mandar a caderneta.
  /auth/refresh:
    post:
      summary: Troca o refresh por um par novo (rotação)
      description: |
        O refresh usado é revogado e um par novo é devolvido. Se o mesmo
        refresh chegar de novo em até 15 s (abas do app renovando juntas),
        a API emite outro par em vez de punir. Depois disso, reuso de um
        refresh rotacionado é tratado como roubo e revoga todas as sessões
        da conta. Refresh revogado por sair ou troca de senha responde 401
        sem derrubar as outras sessões.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: novo par
        '401':
          description: refresh inválido, vencido, revogado ou reutilizado fora da janela
  /auth/sair:
    post:
      summary: Revoga o refresh (e os demais da conta se autenticado)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: sessão encerrada
  /auth/senha:
    post:
      summary: Troca a senha e revoga todos os refresh
      description: >
        Confere senhaAtual, grava bcrypt da nova, revoga as sessões
        e devolve um par novo para este aparelho. Access antigo
        dos outros aparelhos expira sozinho (~15 min).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrocaSenha'
      responses:
        '200':
          description: senha alterada; token e refreshToken novos
        '400':
          description: payload extra, senha curta ou igual à atual
        '401':
          description: token ausente ou senha atual incorreta
  /auth/recuperar:
    post:
      summary: Envia um código de 6 dígitos por e-mail para redefinir a senha
      description: |
        Responde 200 mesmo sem conta para o e-mail, para não entregar quem
        tem cadastro. O código vale 15 min, é de uso único e invalida os
        anteriores da mesma conta. No máximo 3 códigos por hora por e-mail,
        além do limite por IP. Sem RESEND_API_KEY no servidor, responde 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarSenha'
      responses:
        '200':
          description: se houver conta, o código foi enviado
        '429':
          description: limite de códigos ou de tentativas por IP
        '503':
          description: envio de e-mail não configurado neste servidor
  /auth/redefinir:
    post:
      summary: Troca a senha com o código recebido por e-mail
      description: >
        Confere e-mail, código (até 5 tentativas por código), validade e uso.
        Grava bcrypt da senha nova, marca o código como usado, revoga todas
        as sessões e devolve um par novo para este aparelho, como o login.
        Erro único para código errado, vencido, usado ou e-mail sem conta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirSenha'
      responses:
        '200':
          description: senha redefinida; token e refreshToken novos
        '400':
          description: payload extra, código fora do formato ou senha curta
        '401':
          description: código inválido ou vencido
  /auth/termos:
    post:
      summary: Registra o aceite dos termos por quem já tem conta
      description: >
        A versão é a data do texto aceito. Grava a versão e a hora do aceite.
        O servidor não confere se é a mais nova (ADR 0038).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Termos'
      responses:
        '200':
          description: aceite gravado
          content:
            application/json:
              schema:
                type: object
                properties:
                  termosVersao: { type: string }
        '400':
          description: campo a mais ou versão fora do formato
        '401':
          description: token ausente ou inválido
  /auth/conta:
    delete:
      summary: Exclui a conta e os dados remotos, caderneta na nuvem inclusa (CASCADE)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: conta excluída
  /ficha:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ficha com o carimbo do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaLida'
        '404':
          description: ainda não há ficha
    put:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ficha'
      responses:
        '200':
          description: gravada, com o carimbo novo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaLida'
  /manutencao:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: datas com o carimbo do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManutencaoLida'
        '404':
          description: ainda não há
    put:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Manutencao'
      responses:
        '200':
          description: gravada, com o carimbo novo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManutencaoLida'
  /localizacao:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: último ponto
        '404':
          description: ainda não há
    put:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Localizacao'
      responses:
        '200':
          description: gravado
  /caderneta:
    get:
      summary: Devolve a caderneta guardada na conta, decifrada
      security:
        - bearerAuth: []
      responses:
        '200':
          description: caderneta e o carimbo do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadernetaLida'
        '401':
          description: token ausente ou inválido
        '404':
          description: ainda não há caderneta na nuvem
        '500':
          description: a caderneta guardada não abriu (chave trocada ou conteúdo mexido no banco)
        '503':
          description: CADERNETA_CHAVE não configurada neste servidor
    put:
      summary: Grava a caderneta, cifrada, se ninguém mexeu nela antes
      description: |
        O servidor cifra com AES-256-GCM e uma chave que só ele tem, amarrada
        à conta. baseAtualizadoEm é o carimbo que o aparelho recebeu da última
        vez (null na primeira). Se já existe caderneta e o carimbo não bate,
        responde 409 com o atual e não grava. Corpo até 512 KB; as outras rotas
        seguem com 20 KB. Até 30 envios por conta a cada 15 min.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalvarCaderneta'
      responses:
        '200':
          description: gravada, com o carimbo novo
          content:
            application/json:
              schema:
                type: object
                properties:
                  atualizadoEm: { type: string, format: date-time }
        '400':
          description: chave a mais ou faltando, foto, versão errada ou lista grande demais
        '401':
          description: token ausente ou inválido
        '409':
          description: outro aparelho gravou antes; detalhes.atualizadoEm traz o carimbo atual
        '413':
          description: corpo acima de 512 KB
        '429':
          description: passou de 30 envios em 15 minutos
        '503':
          description: CADERNETA_CHAVE não configurada neste servidor
    delete:
      summary: Apaga a caderneta da conta (interruptor desligado)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: apagada, ou já não existia
        '401':
          description: token ausente ou inválido
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credenciais:
      type: object
      additionalProperties: false
      required: [email, senha]
      properties:
        email:
          type: string
        senha:
          type: string
          minLength: 8
          maxLength: 72
    Cadastro:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
        senha:
          type: string
          minLength: 8
          maxLength: 72
        termosVersao:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: Data do texto dos termos que a pessoa aceitou. Opcional enquanto houver APK antigo.
    Termos:
      type: object
      additionalProperties: false
      required: [versao]
      properties:
        versao:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    TrocaSenha:
      type: object
      additionalProperties: false
      required: [senhaAtual, senhaNova]
      properties:
        senhaAtual:
          type: string
          minLength: 8
          maxLength: 72
        senhaNova:
          type: string
          minLength: 8
          maxLength: 72
    RecuperarSenha:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
    RedefinirSenha:
      type: object
      additionalProperties: false
      required: [email, codigo, senhaNova]
      properties:
        email:
          type: string
        codigo:
          type: string
          pattern: '^[0-9]{6}$'
        senhaNova:
          type: string
          minLength: 8
          maxLength: 72
    Ficha:
      type: object
      additionalProperties: false
      required: [marca, modelo, kmLitro, kmAtual]
      properties:
        marca:
          type: string
        modelo:
          type: string
        ano:
          type: integer
          nullable: true
        cilindrada:
          type: integer
          nullable: true
        kmLitro:
          type: number
        kmLitroAlcool:
          type: number
          nullable: true
        combustivel:
          type: string
          enum: [gasolina, alcool]
        kmAtual:
          type: number
        tanqueLitros:
          type: number
          nullable: true
        personalizacoes:
          type: string
    Manutencao:
      type: object
      description: Datas em AAAA-MM-DD, existentes no calendário, ano entre 1980 e 2100. Vazio vira null.
      additionalProperties: false
      properties:
        oleoUltima: { type: string, format: date, nullable: true }
        oleoProxima: { type: string, format: date, nullable: true }
        revisaoUltima: { type: string, format: date, nullable: true }
        pneusUltima: { type: string, format: date, nullable: true }
        pneusProxima: { type: string, format: date, nullable: true }
        ipvaProxima: { type: string, format: date, nullable: true }
        seguroProxima: { type: string, format: date, nullable: true }
        licenciamentoProxima: { type: string, format: date, nullable: true }
    # Resposta do GET/PUT. atualizadoEm é só de leitura; no PUT é recusado.
    FichaLida:
      allOf:
        - $ref: '#/components/schemas/Ficha'
        - type: object
          properties:
            atualizadoEm:
              type: string
              format: date-time
              nullable: true
              readOnly: true
              description: Quando o servidor gravou pela última vez (UTC). O app compara com o valor guardado para saber se outro aparelho mexeu.
    ManutencaoLida:
      allOf:
        - $ref: '#/components/schemas/Manutencao'
        - type: object
          properties:
            atualizadoEm:
              type: string
              format: date-time
              nullable: true
              readOnly: true
    Localizacao:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
        longitude:
          type: number
    ConteudoCaderneta:
      type: object
      description: >
        O que só existe no aparelho, menos a foto. Ficha, datas de manutenção
        e último ponto têm rota própria e não entram aqui. Cada item das listas
        é livre, para o app ganhar campo novo sem quebrar a API.
      additionalProperties: false
      required: [v, abastecimentos, servicos, pins, extra, precoGasolina, precoAlcool, psi]
      properties:
        v:
          type: integer
          enum: [1]
        abastecimentos:
          type: array
          maxItems: 5000
          items: { type: object }
        servicos:
          type: array
          maxItems: 5000
          items: { type: object }
        pins:
          type: array
          maxItems: 5000
          items: { type: object }
        extra:
          type: string
          maxLength: 20000
          nullable: true
          description: km de óleo e corrente e validade da CNH, como o app guarda
        precoGasolina:
          type: string
          maxLength: 20000
          nullable: true
        precoAlcool:
          type: string
          maxLength: 20000
          nullable: true
        psi:
          type: object
          additionalProperties: false
          required: [dianteiro, traseiro]
          properties:
            dianteiro: { type: integer, minimum: 0, maximum: 200, nullable: true }
            traseiro: { type: integer, minimum: 0, maximum: 200, nullable: true }
    SalvarCaderneta:
      type: object
      additionalProperties: false
      required: [conteudo, baseAtualizadoEm]
      properties:
        conteudo:
          $ref: '#/components/schemas/ConteudoCaderneta'
        baseAtualizadoEm:
          type: string
          format: date-time
          nullable: true
    CadernetaLida:
      type: object
      properties:
        conteudo:
          $ref: '#/components/schemas/ConteudoCaderneta'
        atualizadoEm:
          type: string
          format: date-time
