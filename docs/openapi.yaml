openapi: 3.0.3
info:
  title: life.and.roads API
  version: 1.1.0
  description: >
    Cofre opcional da caderneta. Uma moto por conta.
    Sem placa, chassi, RENAVAM, foto, pins ou histórico de posto.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      summary: Liveness (processo no ar)
      responses:
        '200':
          description: ok
  /ready:
    get:
      summary: Readiness (MySQL responde)
      responses:
        '200':
          description: banco ok
        '503':
          description: banco indisponível
  /monitor/evento:
    post:
      summary: Crash do app (mensagem curta, sem PII)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tipo, mensagem]
              properties:
                tipo:
                  type: string
                  enum: [flutter_error, flutter_zone]
                mensagem:
                  type: string
                  maxLength: 500
                ambiente:
                  type: string
                  enum: [development, staging, production]
                versaoApp:
                  type: string
                  maxLength: 40
                  nullable: true
                  description: versionName+build, vindo de --dart-define=APP_VERSION
                plataforma:
                  type: string
                  maxLength: 80
                  nullable: true
                  description: ex. "android 14" ou "web"
                pilha:
                  type: string
                  maxLength: 2000
                  nullable: true
                  description: começo da stack trace, sem dado do piloto
      responses:
        '200':
          description: registrado no log e na tabela eventos_cliente (90 dias)
  /auth/registrar:
    post:
      summary: Cria a conta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciais'
      responses:
        '201':
          description: conta criada
        '409':
          description: e-mail já cadastrado
  /auth/login:
    post:
      summary: Access curto + refresh revogável
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciais'
      responses:
        '200':
          description: token (access) e refreshToken
  /auth/refresh:
    post:
      summary: Troca o refresh por um par novo (rotação)
      description: |
        O refresh usado é revogado e um par novo é devolvido. Se o mesmo
        refresh chegar de novo em até 15 s (abas do app renovando juntas),
        a API emite outro par em vez de punir. Depois disso, reuso de um
        refresh rotacionado é tratado como roubo e revoga todas as sessões
        da conta. Refresh revogado por sair ou troca de senha responde 401
        sem derrubar as outras sessões.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: novo par
        '401':
          description: refresh inválido, vencido, revogado ou reutilizado fora da janela
  /auth/sair:
    post:
      summary: Revoga o refresh (e os demais da conta se autenticado)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: sessão encerrada
  /auth/senha:
    post:
      summary: Troca a senha e revoga todos os refresh
      description: >
        Confere senhaAtual, grava bcrypt da nova, revoga as sessões
        e devolve um par novo para este aparelho. Access antigo
        dos outros aparelhos expira sozinho (~15 min).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrocaSenha'
      responses:
        '200':
          description: senha alterada; token e refreshToken novos
        '400':
          description: payload extra, senha curta ou igual à atual
        '401':
          description: token ausente ou senha atual incorreta
  /auth/conta:
    delete:
      summary: Exclui a conta e os dados remotos (CASCADE)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: conta excluída
  /ficha:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ficha com o carimbo do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaLida'
        '404':
          description: ainda não há ficha
    put:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ficha'
      responses:
        '200':
          description: gravada, com o carimbo novo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaLida'
  /manutencao:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: datas com o carimbo do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManutencaoLida'
        '404':
          description: ainda não há
    put:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Manutencao'
      responses:
        '200':
          description: gravada, com o carimbo novo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManutencaoLida'
  /localizacao:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: último ponto
        '404':
          description: ainda não há
    put:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Localizacao'
      responses:
        '200':
          description: gravado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credenciais:
      type: object
      additionalProperties: false
      required: [email, senha]
      properties:
        email:
          type: string
        senha:
          type: string
          minLength: 8
          maxLength: 72
    TrocaSenha:
      type: object
      additionalProperties: false
      required: [senhaAtual, senhaNova]
      properties:
        senhaAtual:
          type: string
          minLength: 8
          maxLength: 72
        senhaNova:
          type: string
          minLength: 8
          maxLength: 72
    Ficha:
      type: object
      additionalProperties: false
      required: [marca, modelo, kmLitro, kmAtual]
      properties:
        marca:
          type: string
        modelo:
          type: string
        ano:
          type: integer
          nullable: true
        cilindrada:
          type: integer
          nullable: true
        kmLitro:
          type: number
        kmLitroAlcool:
          type: number
          nullable: true
        combustivel:
          type: string
          enum: [gasolina, alcool]
        kmAtual:
          type: number
        tanqueLitros:
          type: number
          nullable: true
        personalizacoes:
          type: string
    Manutencao:
      type: object
      description: Datas em AAAA-MM-DD, existentes no calendário, ano entre 1980 e 2100. Vazio vira null.
      additionalProperties: false
      properties:
        oleoUltima: { type: string, format: date, nullable: true }
        oleoProxima: { type: string, format: date, nullable: true }
        revisaoUltima: { type: string, format: date, nullable: true }
        pneusUltima: { type: string, format: date, nullable: true }
        pneusProxima: { type: string, format: date, nullable: true }
        ipvaProxima: { type: string, format: date, nullable: true }
        seguroProxima: { type: string, format: date, nullable: true }
        licenciamentoProxima: { type: string, format: date, nullable: true }
    # Resposta do GET/PUT. atualizadoEm é só de leitura; no PUT é recusado.
    FichaLida:
      allOf:
        - $ref: '#/components/schemas/Ficha'
        - type: object
          properties:
            atualizadoEm:
              type: string
              format: date-time
              nullable: true
              readOnly: true
              description: Quando o servidor gravou pela última vez (UTC). O app compara com o valor guardado para saber se outro aparelho mexeu.
    ManutencaoLida:
      allOf:
        - $ref: '#/components/schemas/Manutencao'
        - type: object
          properties:
            atualizadoEm:
              type: string
              format: date-time
              nullable: true
              readOnly: true
    Localizacao:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
        longitude:
          type: number
