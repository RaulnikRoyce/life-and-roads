name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    # Mesma família do docker-compose. Sem ele os testes de integração
    # (login, refresh, senha, exclusão) falham no CI em vez de pular.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # Só dependências de produção; alta ou crítica derruba o job.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test

  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  apk:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [api, app]
    runs-on: ubuntu-24.04
    # Para criar a Release da tag e anexar o APK.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Keystore só no CI
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
      - run: flutter pub get
      # Secret API_BASE: HTTPS da API. Vazio = localhost; caderneta local segue.
      - name: APK assinado
        env:
          API_BASE: ${{ secrets.API_BASE }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name="$TAG" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=ENV=production \
            --dart-define=CRASH_REPORTING=true \
            --dart-define=APP_VERSION="$TAG+${GITHUB_RUN_NUMBER}" \
            --dart-define=API_BASE="$API_BASE"
      - uses: actions/upload-artifact@v6
        with:
          name: app-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
      # Release da tag com o .apk anexado: link direto, sem zip, sem prazo.
      - name: Release com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APK="life-and-roads-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          TITULO="life.and.roads $TAG (build ${GITHUB_RUN_NUMBER})"
          NOTAS="APK assinado do beta fechado. Instala por cima da versão anterior sem perder a caderneta. SHA-256: $SHA"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --prerelease --title "$TITULO" --notes "$NOTAS"
          fi
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
